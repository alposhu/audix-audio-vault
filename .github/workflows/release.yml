name: Build and release

# Builds the Windows executables on GitHub's runners and attaches them to a
# release. This means no multi-hundred-megabyte upload from a home connection,
# and the published binary is reproducible from a known clean environment.
#
# Trigger it by pushing a tag:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Or run it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_full:
        description: "Also build the full variant (with the in-app browser, ~529 MB)"
        type: boolean
        default: true

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    # The full variant is 4,200 files and half a gigabyte; compressing it takes
    # noticeably longer than the lite build, so the budget is generous.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PySide6 6.11 wheels cover 3.9-3.13; 3.12 is the safe runner choice.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0

      - name: Verify design tokens
        # Fails the build if any contrast ratio or sRGB gamut check regresses.
        run: python scripts/verify_palette.py

      - name: Byte-compile every module
        run: python -m compileall -q audix run.py scripts packaging

      - name: Build lite (no browser)
        run: python packaging/build_exe.py --lite

      - name: Build full (with browser)
        # A tag push always publishes both variants, so nobody has to pick a
        # build to get the in-app browser. Manual runs can skip it: the extra
        # ~355 MB of Chromium roughly triples the build time.
        if: github.event_name != 'workflow_dispatch' || inputs.include_full
        run: python packaging/build_exe.py

      - name: Package archives
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else { 'dev' }
          New-Item -ItemType Directory -Force artifacts | Out-Null

          # Compress-Archive is used elsewhere but collapses on the full build:
          # 4,200 files takes many minutes and has a habit of failing on deep
          # QtWebEngine paths. The .NET API streams straight to disk instead.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Pack($source, $zip) {
            if (-not (Test-Path $source)) { return }
            $from = (Resolve-Path $source).Path
            $to = Join-Path (Resolve-Path artifacts).Path $zip
            $started = Get-Date
            # $false = do not nest the folder inside the zip, so the archive
            # unpacks straight to audix.exe and its siblings.
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $from, $to, [System.IO.Compression.CompressionLevel]::Optimal, $false)
            $mb = (Get-Item $to).Length / 1MB
            "{0}  {1:N0} MB  in {2:N0}s" -f $zip, $mb, (New-TimeSpan $started (Get-Date)).TotalSeconds
          }

          Pack 'dist/audix-lite' "audix-lite-$version-win64.zip"
          Pack 'dist/audix' "audix-$version-win64.zip"

          # Published so a download can be verified; referenced from SECURITY.md.
          Get-ChildItem artifacts -Filter *.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audix-windows
          path: artifacts/*
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          generate_release_notes: true
          body_path: .github/RELEASE_TEMPLATE.md
